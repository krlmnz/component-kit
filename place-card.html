<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Card — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>
  /* Specimen legend for the icon trigger. Not product chrome. */
  .state-key {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--space-025) var(--space-05);
    align-items: center;
    color: var(--text-2);
    font-size: var(--text-xs);
  }
  .state-key__swatch {
    width: 20px;
    height: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .state-key__swatch--hover { background: var(--surface-2); }
  .state-key__swatch--editing { border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Place Card</h1>
  <p class="stage__label">Default → hover → editing. The icon editor opens only after selection.</p>

  <div class="stage__row" style="align-items:flex-start;">
    <section class="panel panel--pop kit-frame">
      <header class="panel__header">
        <div class="panel__heading"><h2 class="panel__title">Place</h2></div>
        <div class="panel__actions">
          <button class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="panel__body place-card__body">
        <div class="place-card__icon-row">
          <button class="icon-picker-trigger" id="place-icon-trigger" type="button" aria-label="Edit place icon" aria-controls="place-icon-editor" aria-expanded="false">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          </button>

          <div class="icon-edit-panel" id="place-icon-editor" hidden>
            <div class="icon-edit-panel__header">
              <span class="icon-edit-panel__title">Choose icon</span>
              <button class="btn btn--secondary btn--sm" id="place-icon-done" type="button">Done</button>
            </div>
            <div class="tile-grid" role="listbox" aria-label="Place icons">
              <button class="tile tile--selected" type="button" role="option" aria-selected="true" aria-label="Volcano"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
              <button class="tile" type="button" role="option" aria-selected="false" aria-label="City"><svg viewBox="0 0 16 16" fill="none"><rect x="3" y="6" width="4" height="7" stroke="currentColor" stroke-width="1.1"/><rect x="9" y="3" width="4" height="10" stroke="currentColor" stroke-width="1.1"/></svg></button>
              <button class="tile" type="button" role="option" aria-selected="false" aria-label="Food"><svg viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0 0 12 0z" stroke="currentColor" stroke-width="1.1"/><path d="M2 8a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1 2"/></svg></button>
              <button class="tile" type="button" role="option" aria-selected="false" aria-label="Wine"><svg viewBox="0 0 16 16" fill="none"><path d="M5 2h6l-1 6a2 2 0 0 1-4 0z" stroke="currentColor" stroke-width="1.1"/><path d="M8 8v5M6 13h4" stroke="currentColor" stroke-width="1.1"/></svg></button>
              <button class="tile tile--empty" type="button" role="option" aria-selected="false" aria-label="No icon"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.1"/><path d="M4 12 12 4" stroke="currentColor" stroke-width="1.1"/></svg></button>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="field__label">Name</span>
          <input class="input" type="text" value="Volcan Villarica">
        </label>

        <label class="field">
          <span class="field__label">Description</span>
          <textarea class="textarea">Villarrica Volcano in Chile is one of South America's most active and dangerous volcanoes, famous for holding an open, bubbling lava lake inside its summit crater.</textarea>
        </label>
      </div>
    </section>

    <section class="panel kit-frame" style="width:auto;">
      <header class="panel__header">
        <div class="panel__heading"><h2 class="panel__title">Icon trigger states</h2></div>
      </header>
      <div class="panel__body state-key" aria-label="Icon trigger state reference">
        <span class="state-key__swatch" aria-hidden="true"></span><span>Default</span>
        <span class="state-key__swatch state-key__swatch--hover" aria-hidden="true"></span><span>Hover</span>
        <span class="state-key__swatch state-key__swatch--editing" aria-hidden="true"></span><span>Editing / selected</span>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  var trigger = document.getElementById('place-icon-trigger');
  var editor = document.getElementById('place-icon-editor');
  var done = document.getElementById('place-icon-done');
  var options = Array.prototype.slice.call(editor.querySelectorAll('[role="option"]'));

  function setEditing(open) {
    trigger.setAttribute('aria-expanded', String(open));
    editor.hidden = !open;
  }

  trigger.addEventListener('click', function () {
    setEditing(trigger.getAttribute('aria-expanded') !== 'true');
  });

  done.addEventListener('click', function () {
    setEditing(false);
    trigger.focus();
  });

  function applyIcon(option) {
    options.forEach(function (item) {
      item.classList.remove('tile--selected');
      item.setAttribute('aria-selected', 'false');
    });
    option.classList.add('tile--selected');
    option.setAttribute('aria-selected', 'true');

    var label = option.getAttribute('aria-label') || 'Place icon';
    var empty = option.classList.contains('tile--empty');
    trigger.classList.toggle('icon-picker-trigger--empty', empty);
    if (empty) {
      trigger.innerHTML = '';
      trigger.setAttribute('aria-label', 'No icon — choose place icon');
    } else {
      var svg = option.querySelector('svg');
      trigger.innerHTML = svg ? svg.outerHTML : '';
      trigger.setAttribute('aria-label', 'Edit place icon (' + label + ')');
    }
  }

  options.forEach(function (option) {
    option.addEventListener('click', function () {
      applyIcon(option);
    });
  });
})();
</script>
<script src="component-embed.js"></script>
</body>
</html>

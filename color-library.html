<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Library / Icon Library — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <label class="theme-switcher">
    <span class="theme-switcher__label">Theme</span>
    <select class="select select--sm theme-switcher__select" data-theme-select aria-label="Writer theme"></select>
  </label>
</header>

<main class="stage">
  <h1 class="stage__title">Color Library / Icon Library</h1>
  <p class="stage__label">Swatch, combo, and tile-grid. The picker is a static anatomy diagram.</p>

  <div class="stage__row" style="align-items: flex-start;">

    <!-- Color Library: picker + swatch grid -->
    <section class="panel panel--pop kit-frame">
      <header class="panel__header">
        <div class="panel__heading"><h2 class="panel__title">Color Library</h2></div>
        <div class="panel__actions">
          <button class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="panel__body" style="display:flex; flex-direction:column; gap: var(--space-1);">
        <p class="field__hint">Static anatomy. Hue, opacity, and the field do not change the swatch in this reference.</p>

        <div class="color-picker">
          <div class="color-picker__field" style="--picker-hue: #23c28c;">
            <div class="color-picker__cursor"></div>
          </div>
          <div class="color-picker__controls">
            <button class="color-picker__eyedropper" type="button" aria-label="Pick color from screen">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11 2.5 13.5 5 5 13.5H2.5V11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <div class="color-picker__sliders">
              <input class="slider slider--hue" type="range" min="0" max="360" value="150" aria-label="Hue">
              <input class="slider slider--alpha" type="range" min="0" max="100" value="100" aria-label="Opacity">
            </div>
            <span class="swatch swatch--lg" style="--swatch-color:#C3DDD6;"></span>
          </div>
        </div>

        <div class="combo" role="group" aria-label="Picker hex and opacity">
          <label class="combo__hex">
            <span class="combo__prefix">#</span>
            <input class="combo__input" type="text" value="C3DDD6" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Hex color">
          </label>
          <label class="combo__opacity">
            <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Opacity percentage">
            <span class="combo__suffix">%</span>
          </label>
        </div>

        <div class="swatch-grid">
          <button class="swatch swatch--selected" style="--swatch-color:#C3DDD6;" aria-label="Sage green, selected"></button>
          <button class="swatch" style="--swatch-color:#E2E9ED;" aria-label="Pale blue-grey"></button>
          <button class="swatch" style="--swatch-color:#9A1818;" aria-label="Brick red"></button>
          <button class="swatch" style="--swatch-color:#017E89;" aria-label="Teal"></button>
          <button class="swatch" style="--swatch-color:#4C555B;" aria-label="Slate"></button>
          <button class="swatch" style="--swatch-color:#E5E5E5;" aria-label="Light grey"></button>
          <button class="swatch" style="--swatch-color:#092C25;" aria-label="Deep forest"></button>
          <button class="swatch" style="--swatch-color:#5D686F;" aria-label="Grey blue"></button>
          <button class="swatch" style="--swatch-color:#21262A;" aria-label="Charcoal"></button>
          <button class="swatch" aria-label="Add custom color">
            <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px;margin:auto;"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>

      </div>
    </section>

    <!-- Icon Library: search + tile grid + stacked prop rows -->
    <section class="panel panel--pop kit-frame">
      <header class="panel__header">
        <div class="panel__heading"><h2 class="panel__title">Icon Library</h2></div>
        <div class="panel__actions">
          <button class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="panel__body">
        <div class="input-group" style="margin-bottom: var(--space-1);">
          <svg class="input-group__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m13 13-2.7-2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input class="input" type="text" value="Value" aria-label="Search icons">
          <button class="input-group__clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="tile-grid" role="listbox" aria-label="Icons">
          <button class="tile tile--selected" role="option" aria-selected="true" aria-label="Volcano">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          </button>
          <button class="tile" role="option" aria-label="City"><svg viewBox="0 0 16 16" fill="none"><rect x="3" y="6" width="4" height="7" stroke="currentColor" stroke-width="1.1"/><rect x="9" y="3" width="4" height="10" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="tile" role="option" aria-label="Food"><svg viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0 0 12 0z" stroke="currentColor" stroke-width="1.1"/><path d="M2 8a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1 2"/></svg></button>
          <button class="tile" role="option" aria-label="Wine"><svg viewBox="0 0 16 16" fill="none"><path d="M5 2h6l-1 6a2 2 0 0 1-4 0z" stroke="currentColor" stroke-width="1.1"/><path d="M8 8v5M6 13h4" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="tile" role="option" aria-label="Volcano 2"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
          <button class="tile" role="option" aria-label="Volcano 3"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
          <button class="tile" role="option" aria-label="Volcano 4"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
          <button class="tile" role="option" aria-label="Volcano 5"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
          <button class="tile" role="option" aria-label="Volcano 6"><svg viewBox="0 0 16 16" fill="none"><path d="M2 13h12l-3-6-2 2-1-3-2 4-1-1z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <div class="prop-row">
        <span class="field-label">Icon</span>
        <div class="prop-row__body combo" role="group" aria-label="Icon color">
          <span class="swatch" style="--swatch-color:#9A1818;"></span>
          <label class="combo__hex">
            <span class="combo__prefix">#</span>
            <input class="combo__input" type="text" value="9A1818" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Icon hex color">
          </label>
          <label class="combo__opacity">
            <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Icon opacity percentage">
            <span class="combo__suffix">%</span>
          </label>
        </div>
      </div>

      <div class="prop-row">
        <span class="field-label">Background</span>
        <div class="prop-row__body combo" role="group" aria-label="Background color">
          <span class="swatch" style="--swatch-color:#E2E9ED;"></span>
          <label class="combo__hex">
            <span class="combo__prefix">#</span>
            <input class="combo__input" type="text" value="E2E9ED" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Background hex color">
          </label>
          <label class="combo__opacity">
            <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Background opacity percentage">
            <span class="combo__suffix">%</span>
          </label>
        </div>
      </div>

      <div class="prop-row">
        <span class="field-label">Border</span>
        <div class="prop-row__body combo" role="group" aria-label="Border color and weight">
          <span class="swatch" style="--swatch-color:#4C555B;"></span>
          <label class="combo__hex">
            <span class="combo__prefix">#</span>
            <input class="combo__input" type="text" value="4C555B" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Border hex color">
          </label>
          <label class="combo__opacity">
            <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Border opacity percentage">
            <span class="combo__suffix">%</span>
          </label>
          <label class="combo__width">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 5h12M2 8h12M2 11h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input class="combo__input" type="number" value="1" min="0" step="0.5" inputmode="decimal" aria-label="Border thickness">
          </label>
        </div>
      </div>
    </section>

  </div>
</main>
<script>
  document.querySelectorAll('.input-group').forEach(function (field) {
    var input = field.querySelector('input');
    var clear = field.querySelector('.input-group__clear');
    if (!input || !clear) return;
    clear.addEventListener('click', function () {
      input.value = '';
      input.focus();
    });
  });
</script>
<script src="component-embed.js"></script>

<script src="theme.js"></script>
</body>
</html>

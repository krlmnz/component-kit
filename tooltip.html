<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" type="button" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Tooltip</h1>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Map toolbar</h2></div>
    </header>
    <div class="panel__body">
      <div class="stage__row" style="align-items:center; gap: var(--space-3);">

        <span class="tooltip-wrap">
          <button class="icon-btn" type="button" aria-label="Add a pin">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <span class="tooltip" aria-hidden="true">Add a pin</span>
        </span>

        <span class="tooltip-wrap">
          <button class="icon-btn" type="button" aria-label="Map settings">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <span class="tooltip" aria-hidden="true">Map settings</span>
        </span>

        <span class="tooltip-wrap">
          <button class="icon-btn" type="button" aria-label="Preview as guest">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8s2.2-4.5 6-4.5S14 8 14 8s-2.2 4.5-6 4.5S2 8 2 8Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <span class="tooltip tooltip--right" aria-hidden="true">Preview as guest</span>
        </span>

      </div>
    </div>
  </section>
</main>
<script src="component-embed.js"></script>
</body>
</html>

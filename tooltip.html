<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>

  .tooltip-wrap { position: relative; display: inline-flex; }
  .tooltip {
    position: absolute; left: 50%; bottom: calc(100% + var(--space-05)); transform: translateX(-50%) translateY(var(--space-025));
    background: var(--text); color: var(--bg);
    font-size: var(--text-xs); font-weight: 600;
    padding: var(--space-025) var(--space-05); border-radius: var(--radius-sm);
    white-space: nowrap;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
    transition: opacity var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
    z-index: 50;
  }
  .tooltip::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--text);
  }
  .tooltip-wrap:hover .tooltip,
  .tooltip-wrap:focus-within .tooltip {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  .tooltip--right { left: calc(100% + var(--space-05)); bottom: 50%; transform: translateY(50%) translateX(calc(var(--space-025) * -1)); top: auto; }
  .tooltip--right::after { top: 50%; left: -5px; transform: translateY(-50%) rotate(-90deg); border-top-color: var(--text); }
  .tooltip-wrap:hover .tooltip--right,
  .tooltip-wrap:focus-within .tooltip--right { transform: translateY(50%) translateX(0); }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Tooltip</h1>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Map toolbar</h2></div>
    </header>
    <div class="panel__body">
      <div class="stage__row" style="align-items:center; gap: var(--space-3);">

        <span class="tooltip-wrap">
          <button class="icon-btn" style="width:32px;height:32px;" tabindex="0" aria-describedby="tt1">
            <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <span class="tooltip" role="tooltip" id="tt1">Add a pin</span>
        </span>

        <span class="tooltip-wrap">
          <button class="icon-btn" style="width:32px;height:32px;" tabindex="0" aria-describedby="tt2">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <span class="tooltip" role="tooltip" id="tt2">Map settings</span>
        </span>

        <span class="tooltip-wrap">
          <button class="icon-btn" style="width:32px;height:32px;" tabindex="0" aria-describedby="tt3">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 8s2.2-4.5 6-4.5S14 8 14 8s-2.2 4.5-6 4.5S2 8 2 8Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <span class="tooltip tooltip--right" role="tooltip" id="tt3">Preview as guest</span>
        </span>

      </div>
    </div>
  </section>
</main>
<script src="component-embed.js"></script>
</body>
</html>

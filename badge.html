<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge / Chip — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Badge / Chip</h1>

  <section>
    <p class="stage__label">Status badges</p>
    <div class="stage__row" style="align-items:center;">
      <span class="badge badge--neutral"><span class="badge__dot"></span>Draft</span>
      <span class="badge badge--accent"><span class="badge__dot"></span>In review</span>
      <span class="badge badge--success"><span class="badge__dot"></span>Published</span>
      <span class="badge badge--warn"><span class="badge__dot"></span>Needs attention</span>
      <span class="badge badge--error"><span class="badge__dot"></span>Failed</span>
    </div>
  </section>

  <section>
    <p class="stage__label">Count badges (used in panel headers)</p>
    <div class="stage__row" style="align-items:center;">
      <span class="badge badge--accent">14</span>
      <span class="badge badge--neutral">New</span>
    </div>
  </section>

  <section>
    <p class="stage__label">Filter chips</p>
    <div class="stage__row" style="align-items:center;">
      <span class="chip chip--selected"><span class="chip__swatch" style="background:var(--accent);"></span>Stay</span>
      <span class="chip"><span class="chip__swatch" style="background:var(--success);"></span>Eat</span>
      <span class="chip"><span class="chip__swatch" style="background:var(--warn);"></span>See</span>
      <span class="chip">Do
        <span class="chip__remove" role="button" aria-label="Remove Do filter">
          <svg viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
      </span>
    </div>
  </section>
</main>
<script src="component-embed.js"></script>
</body>
</html>

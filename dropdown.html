<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown / Menu — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>

  .menu { position: relative; display: inline-block; }
  .menu__panel {
    position: absolute; top: calc(100% + var(--space-05)); left: 0;
    width: 220px;
    opacity: 0; transform: translateY(calc(var(--space-025) * -1)); pointer-events: none;
    transition: opacity var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
    z-index: 60;
  }
  .menu.is-open .menu__panel { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .menu-list { display: flex; flex-direction: column; padding: var(--space-05); }
  .menu-list__item {
    display: flex; align-items: center; gap: var(--space-05);
    width: 100%; text-align: left;
    font-size: var(--text-sm); padding: var(--space-05);
    border-radius: var(--radius-sm); color: var(--text);
  }
  .menu-list__item:hover { background: var(--surface-2); }
  .menu-list__item svg { width: 15px; height: 15px; color: var(--text-2); flex-shrink: 0; }
  .menu-list__item--danger { color: var(--error-text); }
  .menu-list__item--danger svg { color: var(--error-text); }
  .menu-list__divider { height: 1px; background: var(--border); margin: var(--space-05) var(--space-025); }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Dropdown / Menu</h1>
  <p class="stage__label">Floating menu body reuses .panel (panel--pop, panel--flush)</p>

  <div class="stage__row">
    <div class="menu" id="menu-1">
      <button class="btn" onclick="document.getElementById('menu-1').classList.toggle('is-open')">
        Sort by
        <svg viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu__panel">
        <section class="panel panel--pop panel--flush">
          <div class="panel__body">
            <div class="menu-list" role="menu">
              <button class="menu-list__item" role="menuitem">Recently added</button>
              <button class="menu-list__item" role="menuitem">Alphabetical</button>
              <button class="menu-list__item" role="menuitem">Category</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="menu" id="menu-2">
      <button class="icon-btn" style="width:32px;height:32px; border:1px solid var(--border);" onclick="document.getElementById('menu-2').classList.toggle('is-open')" aria-label="Place actions">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>
      </button>
      <div class="menu__panel">
        <section class="panel panel--pop panel--flush">
          <div class="panel__body">
            <div class="menu-list" role="menu">
              <button class="menu-list__item" role="menuitem">
                <svg viewBox="0 0 16 16" fill="none"><path d="M11 2.5 13.5 5 5 13.5H2.5V11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                Edit
              </button>
              <button class="menu-list__item" role="menuitem">
                <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 3V2a1 1 0 0 1 1-1H13a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H12.5" stroke="currentColor" stroke-width="1.3"/></svg>
                Duplicate
              </button>
              <div class="menu-list__divider"></div>
              <button class="menu-list__item menu-list__item--danger" role="menuitem">
                <svg viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M4.5 4.5 5 13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Delete
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>

<script>
  document.addEventListener('click', function (e) {
    document.querySelectorAll('.menu.is-open').forEach(function (menu) {
      if (!menu.contains(e.target)) menu.classList.remove('is-open');
    });
  });
</script>
<script src="component-embed.js"></script>
</body>
</html>

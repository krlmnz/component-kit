<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown / Menu — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" type="button" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Dropdown / Menu</h1>
  <p class="stage__label">Floating menu body reuses .panel (panel--pop, panel--flush)</p>

  <div class="stage__row">
    <div class="menu" id="menu-1">
      <button class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-1-list">
        Sort by
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu__panel" hidden>
        <section class="panel panel--pop panel--flush">
          <div class="panel__body">
            <div class="menu-list" id="menu-1-list" role="menu">
              <button class="menu-list__item" type="button" role="menuitem" tabindex="-1">Recently added</button>
              <button class="menu-list__item" type="button" role="menuitem" tabindex="-1">Alphabetical</button>
              <button class="menu-list__item" type="button" role="menuitem" tabindex="-1">Category</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="menu" id="menu-2">
      <button class="btn btn--secondary btn--icon" type="button" aria-label="Place actions" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-2-list">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>
      </button>
      <div class="menu__panel" hidden>
        <section class="panel panel--pop panel--flush">
          <div class="panel__body">
            <div class="menu-list" id="menu-2-list" role="menu">
              <button class="menu-list__item" type="button" role="menuitem" tabindex="-1">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11 2.5 13.5 5 5 13.5H2.5V11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                Edit
              </button>
              <button class="menu-list__item" type="button" role="menuitem" tabindex="-1">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 3V2a1 1 0 0 1 1-1H13a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H12.5" stroke="currentColor" stroke-width="1.3"/></svg>
                Duplicate
              </button>
              <div class="menu-list__divider" role="separator"></div>
              <button class="menu-list__item menu-list__item--danger" type="button" role="menuitem" tabindex="-1">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M4.5 4.5 5 13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Delete
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  function triggerOf(menu) {
    return menu.querySelector('[aria-haspopup="menu"]');
  }
  function panelOf(menu) {
    return menu.querySelector('.menu__panel');
  }
  function itemsOf(menu) {
    return Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));
  }
  function isOpen(menu) {
    return triggerOf(menu).getAttribute('aria-expanded') === 'true';
  }
  function closeMenu(menu, restore) {
    if (!isOpen(menu)) return;
    var trigger = triggerOf(menu);
    trigger.setAttribute('aria-expanded', 'false');
    menu.classList.remove('is-open');
    panelOf(menu).hidden = true;
    if (restore) trigger.focus();
  }
  function openMenu(menu, focusMode) {
    document.querySelectorAll('.menu').forEach(function (other) {
      if (other !== menu) closeMenu(other, false);
    });
    var trigger = triggerOf(menu);
    var panel = panelOf(menu);
    trigger.setAttribute('aria-expanded', 'true');
    panel.hidden = false;
    window.requestAnimationFrame(function () { menu.classList.add('is-open'); });
    var items = itemsOf(menu);
    if (!items.length || focusMode === 'none') return;
    var target = focusMode === 'last' ? items[items.length - 1] : items[0];
    target.focus();
  }
  function move(menu, delta) {
    var items = itemsOf(menu);
    if (!items.length) return;
    var index = items.indexOf(document.activeElement);
    var next = index < 0
      ? (delta > 0 ? 0 : items.length - 1)
      : (index + delta + items.length) % items.length;
    items[next].focus();
  }

  document.querySelectorAll('.menu').forEach(function (menu) {
    var trigger = triggerOf(menu);
    var panel = panelOf(menu);

    trigger.addEventListener('click', function () {
      if (isOpen(menu)) closeMenu(menu, false);
      else openMenu(menu, 'first');
    });

    trigger.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        openMenu(menu, 'first');
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        openMenu(menu, 'last');
      } else if (event.key === 'Escape' && isOpen(menu)) {
        event.preventDefault();
        closeMenu(menu, true);
      }
    });

    panel.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        move(menu, 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        move(menu, -1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        var first = itemsOf(menu)[0];
        if (first) first.focus();
      } else if (event.key === 'End') {
        event.preventDefault();
        var items = itemsOf(menu);
        if (items.length) items[items.length - 1].focus();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        closeMenu(menu, true);
      } else if (event.key === 'Tab') {
        closeMenu(menu, false);
      }
    });

    panel.addEventListener('click', function (event) {
      if (event.target.closest('[role="menuitem"]')) closeMenu(menu, true);
    });
  });

  document.addEventListener('click', function (event) {
    document.querySelectorAll('.menu').forEach(function (menu) {
      if (isOpen(menu) && !menu.contains(event.target)) closeMenu(menu, false);
    });
  });
})();
</script>
<script src="component-embed.js"></script>
</body>
</html>

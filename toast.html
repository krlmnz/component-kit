<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast / Alert — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" type="button" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Toast / Alert</h1>

  <section>
    <p class="stage__label">Inline alerts (banners)</p>
    <div class="stage__row" style="flex-direction: column; width: 100%;">
      <div class="alert alert--info">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 8v5M9 5.5v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Draft saved</div>Changes are stored locally until you publish.</div>
      </div>
      <div class="alert alert--success">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M6 9.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="alert__body"><div class="alert__title">Map published</div>Your guests can now view it at the shared link.</div>
      </div>
      <div class="alert alert--warn">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3 16 15H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 8v3M9 12.5v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Unsaved changes</div>3 pins were moved but not yet saved.</div>
      </div>
      <div class="alert alert--error">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5.5v4M9 12v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Couldn't save</div>Check your connection and try again.</div>
      </div>
    </div>
  </section>

  <section>
    <p class="stage__label">Toast (floating)</p>
    <div class="stage__row">
      <button class="btn" type="button" id="toast-success-demo">Trigger success toast</button>
      <button class="btn" type="button" id="toast-error-demo">Trigger error toast</button>
    </div>
  </section>
</main>

<div class="visually-hidden" id="toast-announcer-polite" aria-live="polite" aria-atomic="true"></div>
<div class="visually-hidden" id="toast-announcer-assertive" aria-live="assertive" aria-atomic="true"></div>
<div class="toast-tray" id="toast-tray"></div>

<script>
(function () {
  var ICONS = {
    success: '<svg class="toast__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M6 9.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    error: '<svg class="toast__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5.5v4M9 12v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
  };
  var DISMISS_ICON = '<svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  var toastId = 0;

  function announce(kind, message) {
    var region = document.getElementById(kind === 'error' ? 'toast-announcer-assertive' : 'toast-announcer-polite');
    region.textContent = '';
    window.setTimeout(function () { region.textContent = message; }, 30);
  }

  function spawnToast(kind, title, body) {
    var isError = kind === 'error';
    var status = isError ? 'Error' : 'Success';
    var tray = document.getElementById('toast-tray');
    var id = 'toast-' + (++toastId);
    var el = document.createElement('div');
    el.className = 'toast toast--' + (isError ? 'error' : 'success');
    el.setAttribute('role', 'group');
    el.setAttribute('aria-labelledby', id + '-text');

    var icon = document.createElement('span');
    icon.innerHTML = ICONS[isError ? 'error' : 'success'];

    var content = document.createElement('div');
    content.className = 'toast__body';
    content.id = id + '-text';
    var statusEl = document.createElement('span');
    statusEl.className = 'visually-hidden';
    statusEl.textContent = status + '. ';
    var titleEl = document.createElement('div');
    titleEl.className = 'toast__title';
    titleEl.textContent = title;
    var bodyEl = document.createElement('div');
    bodyEl.textContent = body;
    content.append(statusEl, titleEl, bodyEl);

    var dismiss = document.createElement('button');
    dismiss.type = 'button';
    dismiss.className = 'toast__dismiss';
    dismiss.setAttribute('aria-label', 'Dismiss notification');
    dismiss.setAttribute('aria-describedby', id + '-text');
    dismiss.innerHTML = DISMISS_ICON;

    el.append(icon.firstChild, content, dismiss);
    tray.appendChild(el);
    announce(isError ? 'error' : 'success', status + '. ' + title + '. ' + body);

    var remaining = 4000;
    var timer = null;
    var started = 0;
    function clearTimer() { window.clearTimeout(timer); timer = null; }
    function remove() { clearTimer(); el.remove(); }
    function arm() {
      clearTimer();
      started = Date.now();
      timer = window.setTimeout(remove, Math.max(0, remaining));
    }
    function pause() {
      if (!timer) return;
      remaining -= Date.now() - started;
      clearTimer();
    }
    function resume() {
      if (!el.isConnected || timer) return;
      arm();
    }
    arm();
    el.addEventListener('mouseenter', pause);
    el.addEventListener('mouseleave', function () {
      if (!el.contains(document.activeElement)) resume();
    });
    el.addEventListener('focusin', pause);
    el.addEventListener('focusout', function (event) {
      if (!el.contains(event.relatedTarget) && !el.matches(':hover')) resume();
    });
    dismiss.addEventListener('click', remove);
  }

  document.getElementById('toast-success-demo').addEventListener('click', function () {
    spawnToast('success', 'Map published', 'Your guests can now view it.');
  });
  document.getElementById('toast-error-demo').addEventListener('click', function () {
    spawnToast('error', 'Couldn’t save', 'Check your connection and try again.');
  });
})();
</script>
<script src="component-embed.js"></script>
</body>
</html>

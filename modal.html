<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>
  /* Specimen layout only — dialog chrome is .modal-overlay in global.css. */
  .modal-demo-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    max-width: 260px;
  }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn btn--secondary" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Modal / Dialog</h1>
  <p class="stage__label">Built on the same .panel shell — panel--pop for elevation</p>

  <div class="stage__row">
    <div class="modal-demo-card">
      <button class="btn btn--primary" onclick="document.getElementById('modal-confirm').classList.add('is-open')">Open confirm dialog</button>
    </div>
    <div class="modal-demo-card">
      <button class="btn btn--secondary" onclick="document.getElementById('modal-form').classList.add('is-open')">Open form dialog</button>
    </div>
  </div>

  <!-- Confirm / destructive modal -->
  <div class="modal-overlay" id="modal-confirm" onclick="if(event.target===this) this.classList.remove('is-open')">
    <section class="panel panel--pop" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
      <header class="panel__header">
        <div class="panel__heading">
          <h2 class="panel__title" id="modal-confirm-title">Delete this map?</h2>
          <p class="panel__subtitle">This can't be undone</p>
        </div>
        <div class="panel__actions">
          <button class="icon-btn" aria-label="Close" onclick="document.getElementById('modal-confirm').classList.remove('is-open')">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="panel__body">
        <p style="font-size: var(--text-sm); color: var(--text-2);">"Chile 2026" and its 14 pins will be permanently removed for you and any guests with the link.</p>
      </div>
      <footer class="panel__footer">
        <button class="btn btn--secondary" onclick="document.getElementById('modal-confirm').classList.remove('is-open')">Cancel</button>
        <button class="btn btn--danger" onclick="document.getElementById('modal-confirm').classList.remove('is-open')">Delete map</button>
      </footer>
    </section>
  </div>

  <!-- Form modal -->
  <div class="modal-overlay" id="modal-form" onclick="if(event.target===this) this.classList.remove('is-open')">
    <section class="panel panel--pop" role="dialog" aria-modal="true" aria-labelledby="modal-form-title">
      <header class="panel__header">
        <div class="panel__heading">
          <h2 class="panel__title" id="modal-form-title">Invite a guest</h2>
        </div>
        <div class="panel__actions">
          <button class="icon-btn" aria-label="Close" onclick="document.getElementById('modal-form').classList.remove('is-open')">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="panel__body">
        <label class="field">
          <span class="field__label">Email address</span>
          <input class="input" type="email" placeholder="friend@email.com">
        </label>
      </div>
      <footer class="panel__footer">
        <button class="btn btn--secondary" onclick="document.getElementById('modal-form').classList.remove('is-open')">Cancel</button>
        <button class="btn btn--primary" onclick="document.getElementById('modal-form').classList.remove('is-open')">Send invite</button>
      </footer>
    </section>
  </div>
</main>
<script src="component-embed.js"></script>
</body>
</html>

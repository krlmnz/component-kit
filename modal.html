<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>
  /* Specimen layout only — dialog chrome is dialog.modal in global.css. */
  .modal-demo-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    max-width: 260px;
  }
  .modal-field {
    display: flex; flex-direction: column; gap: var(--space-05);
    font-size: var(--text-sm);
  }
  .modal-field__label { font-weight: 600; }
  .modal-field__input {
    font-size: var(--text-base);
    padding: var(--space-05) var(--space-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
  }
  .modal-field__input:focus-visible {
    outline: none;
    border-color: var(--focus-color);
    box-shadow: var(--focus-ring);
  }
  .modal-copy {
    font-size: var(--text-sm);
    color: var(--text-2);
  }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn btn--secondary" type="button" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Modal / Dialog</h1>
  <p class="stage__label">Built on the same .panel shell — panel--pop for elevation</p>

  <div class="stage__row">
    <div class="modal-demo-card">
      <button class="btn btn--primary" type="button" data-dialog-open="modal-confirm">Open confirm dialog</button>
    </div>
    <div class="modal-demo-card">
      <button class="btn btn--secondary" type="button" data-dialog-open="modal-form">Open form dialog</button>
    </div>
  </div>
</main>

<dialog class="modal" id="modal-confirm" aria-labelledby="modal-confirm-title" aria-describedby="modal-confirm-note modal-confirm-desc">
  <section class="panel panel--pop">
    <header class="panel__header">
      <div class="panel__heading">
        <h2 class="panel__title" id="modal-confirm-title">Delete this map?</h2>
        <p class="panel__subtitle" id="modal-confirm-note">This can't be undone</p>
      </div>
      <div class="panel__actions">
        <button class="icon-btn" type="button" aria-label="Close" data-dialog-close>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="panel__body">
      <p class="modal-copy" id="modal-confirm-desc">"Chile 2026" and its 14 pins will be permanently removed for you and any guests with the link.</p>
    </div>
    <footer class="panel__footer">
      <button class="btn btn--secondary" type="button" data-dialog-close autofocus>Cancel</button>
      <button class="btn btn--danger" type="button" data-dialog-close>Delete map</button>
    </footer>
  </section>
</dialog>

<dialog class="modal" id="modal-form" aria-labelledby="modal-form-title">
  <section class="panel panel--pop">
    <header class="panel__header">
      <div class="panel__heading">
        <h2 class="panel__title" id="modal-form-title">Invite a guest</h2>
      </div>
      <div class="panel__actions">
        <button class="icon-btn" type="button" aria-label="Close" data-dialog-close>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="panel__body" style="display:flex; flex-direction:column; gap: var(--space-1);">
      <label class="modal-field" for="modal-form-email">
        <span class="modal-field__label">Email address</span>
        <input class="modal-field__input" id="modal-form-email" type="email" placeholder="friend@email.com" autocomplete="email" autofocus>
      </label>
    </div>
    <footer class="panel__footer">
      <button class="btn btn--secondary" type="button" data-dialog-close>Cancel</button>
      <button class="btn btn--primary" type="button" data-dialog-close>Send invite</button>
    </footer>
  </section>
</dialog>

<script>
(function () {
  var openers = new WeakMap();

  function tabbable(container) {
    return Array.prototype.filter.call(container.querySelectorAll('a[href], button, input, select, textarea, [tabindex]'), function (el) {
      if (el.disabled || el.tabIndex < 0 || el.closest('[hidden]')) return false;
      var style = window.getComputedStyle(el);
      return style.display !== 'none' && style.visibility !== 'hidden';
    });
  }

  function openDialog(dialog, opener) {
    if (!dialog || dialog.open || typeof dialog.showModal !== 'function') return;
    openers.set(dialog, opener || document.activeElement);
    dialog.showModal();
  }

  document.addEventListener('click', function (event) {
    var opener = event.target.closest('[data-dialog-open]');
    if (opener) {
      openDialog(document.getElementById(opener.getAttribute('data-dialog-open')), opener);
      return;
    }
    var closer = event.target.closest('[data-dialog-close]');
    if (closer) {
      var dialog = closer.closest('dialog');
      if (dialog) dialog.close();
    }
  });

  document.querySelectorAll('dialog.modal').forEach(function (dialog) {
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab') return;
      var items = tabbable(dialog);
      if (!items.length) {
        event.preventDefault();
        return;
      }
      var first = items[0];
      var last = items[items.length - 1];
      var active = document.activeElement;
      if (event.shiftKey && (active === first || !dialog.contains(active))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (active === last || !dialog.contains(active))) {
        event.preventDefault();
        first.focus();
      }
    });
    dialog.addEventListener('close', function () {
      var opener = openers.get(dialog);
      if (opener && opener.isConnected) opener.focus();
    });
  });
})();
</script>
<script src="component-embed.js"></script>
</body>
</html>

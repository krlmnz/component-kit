<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>

  .tabs__list {
    display: flex; gap: var(--space-1);
    border-bottom: 1px solid var(--border);
  }
  .tabs__tab {
    font-size: var(--text-sm); font-weight: 600; color: var(--text-2);
    padding: var(--space-05);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease);
  }
  .tabs__tab:hover { color: var(--text); }
  .tabs__tab[aria-selected="true"] { color: var(--accent-text); border-color: var(--accent); }
  .tabs__panel { padding-top: var(--space-1); font-size: var(--text-sm); color: var(--text-2); }
  .tabs__panel[hidden] { display: none; }

  /* pill variant */
  .tabs--pill .tabs__list { border-bottom: none; background: var(--surface-2); padding: var(--space-025); border-radius: var(--radius-full); display: inline-flex; }
  .tabs--pill .tabs__tab { border-radius: var(--radius-full); border-bottom: none; margin-bottom: 0; padding: var(--space-05) var(--space-1); }
  .tabs--pill .tabs__tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Tabs</h1>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Underline tabs</h2></div>
    </header>
    <div class="panel__body">
      <div class="tabs" data-tabs>
        <div class="tabs__list" role="tablist">
          <button class="tabs__tab" role="tab" aria-selected="true" data-tab-target="t1">Places</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab-target="t2">Legend</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab-target="t3">Guests</button>
        </div>
        <div class="tabs__panel" id="t1" role="tabpanel">14 pins across 4 categories.</div>
        <div class="tabs__panel" id="t2" role="tabpanel" hidden>Stay, Eat, See, Do — with custom colors.</div>
        <div class="tabs__panel" id="t3" role="tabpanel" hidden>3 guests have viewed this map.</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Pill tabs</h2></div>
    </header>
    <div class="panel__body">
      <div class="tabs tabs--pill" data-tabs>
        <div class="tabs__list" role="tablist">
          <button class="tabs__tab" role="tab" aria-selected="true" data-tab-target="p1">Edit</button>
          <button class="tabs__tab" role="tab" aria-selected="false" data-tab-target="p2">Preview</button>
        </div>
        <div class="tabs__panel" id="p1" role="tabpanel">Editing view.</div>
        <div class="tabs__panel" id="p2" role="tabpanel" hidden>Preview view.</div>
      </div>
    </div>
  </section>
</main>

<script>
  document.querySelectorAll('[data-tabs]').forEach(function (root) {
    root.querySelectorAll('[role="tab"]').forEach(function (tab) {
      tab.addEventListener('click', function () {
        root.querySelectorAll('[role="tab"]').forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
        root.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = true; });
        tab.setAttribute('aria-selected', 'true');
        document.getElementById(tab.dataset.tabTarget).hidden = false;
      });
    });
  });
</script>
<script src="component-embed.js"></script>
</body>
</html>

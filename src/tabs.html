<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <label class="theme-switcher">
    <span class="theme-switcher__label">Theme</span>
    <select class="select select--sm theme-switcher__select" data-theme-select aria-label="Writer theme"></select>
  </label>
</header>

<main class="stage">
  <h1 class="stage__title">Tabs</h1>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Underline tabs</h2></div>
    </header>
    <div class="panel__body">
      <div class="tabs" data-tabs>
        <div class="tabs__list" role="tablist" aria-label="Map sections">
          <button class="tabs__tab" type="button" role="tab" id="tab-t1" aria-selected="true" aria-controls="t1">Places</button>
          <button class="tabs__tab" type="button" role="tab" id="tab-t2" aria-selected="false" aria-controls="t2">Legend</button>
          <button class="tabs__tab" type="button" role="tab" id="tab-t3" aria-selected="false" aria-controls="t3">Guests</button>
        </div>
        <div class="tabs__panel" id="t1" role="tabpanel" aria-labelledby="tab-t1">14 pins across 4 categories.</div>
        <div class="tabs__panel" id="t2" role="tabpanel" aria-labelledby="tab-t2" hidden>Stay, Eat, See, Do — with custom colors.</div>
        <div class="tabs__panel" id="t3" role="tabpanel" aria-labelledby="tab-t3" hidden>3 guests have viewed this map.</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Pill tabs</h2></div>
    </header>
    <div class="panel__body">
      <div class="tabs tabs--pill" data-tabs>
        <div class="tabs__list" role="tablist" aria-label="Editor mode">
          <button class="tabs__tab" type="button" role="tab" id="tab-p1" aria-selected="true" aria-controls="p1">Edit</button>
          <button class="tabs__tab" type="button" role="tab" id="tab-p2" aria-selected="false" aria-controls="p2">Preview</button>
        </div>
        <div class="tabs__panel" id="p1" role="tabpanel" aria-labelledby="tab-p1">Editing view.</div>
        <div class="tabs__panel" id="p2" role="tabpanel" aria-labelledby="tab-p2" hidden>Preview view.</div>
      </div>
    </div>
  </section>
</main>

<script>
  document.querySelectorAll('[data-tabs]').forEach(function (root) {
    root.querySelectorAll('[role="tab"]').forEach(function (tab) {
      tab.addEventListener('click', function () {
        root.querySelectorAll('[role="tab"]').forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
        root.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = true; });
        tab.setAttribute('aria-selected', 'true');
        var panel = document.getElementById(tab.getAttribute('aria-controls'));
        if (panel) panel.hidden = false;
      });
    });
  });
</script>
<script src="component-embed.js"></script>

<script src="theme.js"></script>
</body>
</html>

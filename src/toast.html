<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast / Alert — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Toast / Alert</h1>

  <section>
    <p class="stage__label">Inline alerts (banners)</p>
    <div class="stage__row" style="flex-direction: column; width: 100%;">
      <div class="alert alert--info">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 8v5M9 5.5v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Draft saved</div>Changes are stored locally until you publish.</div>
      </div>
      <div class="alert alert--success">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M6 9.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="alert__body"><div class="alert__title">Map published</div>Your guests can now view it at the shared link.</div>
      </div>
      <div class="alert alert--warn">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none"><path d="M9 3 16 15H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 8v3M9 12.5v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Unsaved changes</div>3 pins were moved but not yet saved.</div>
      </div>
      <div class="alert alert--error">
        <svg class="alert__icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5.5v4M9 12v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="alert__body"><div class="alert__title">Couldn't save</div>Check your connection and try again.</div>
      </div>
    </div>
  </section>

  <section>
    <p class="stage__label">Toast (floating)</p>
    <div class="stage__row">
      <button class="btn" onclick="spawnToast('success','Map published','Your guests can now view it.')">Trigger success toast</button>
      <button class="btn" onclick="spawnToast('error','Couldn’t save','Check your connection and try again.')">Trigger error toast</button>
    </div>
  </section>
</main>

<div class="toast-tray" id="toast-tray"></div>

<script>
  function spawnToast(kind, title, body) {
    var tray = document.getElementById('toast-tray');
    var el = document.createElement('div');
    el.className = 'toast toast--' + kind;
    var icon = kind === 'success'
      ? '<svg class="toast__icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M6 9.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg class="toast__icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5.5v4M9 12v.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
    el.innerHTML = icon + '<div class="toast__body"><div class="toast__title">' + title + '</div>' + body + '</div>';
    tray.appendChild(el);
    setTimeout(function () { el.remove(); }, 4000);
  }
</script>
<script src="component-embed.js"></script>
</body>
</html>

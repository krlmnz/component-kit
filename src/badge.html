<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge / Chip — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>

  .badge {
    display: inline-flex; align-items: center; gap: var(--space-025);
    font-size: var(--text-xs); font-weight: 700;
    padding: var(--space-025) var(--space-05); border-radius: var(--radius-full);
    line-height: 1.4;
  }
  .badge--neutral { background: var(--surface-2); color: var(--text-2); }
  .badge--accent  { background: var(--accent-soft); color: var(--accent-text); }
  .badge--success { background: var(--success-soft); color: var(--success-text); }
  .badge--warn    { background: var(--warn-soft); color: var(--warn-text); }
  .badge--error   { background: var(--error-soft); color: var(--error-text); }
  .badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .chip {
    display: inline-flex; align-items: center; gap: var(--space-05);
    font-size: var(--text-sm); font-weight: 600;
    padding: var(--space-025) var(--space-05); border-radius: var(--radius-full);
    background: var(--surface-2); color: var(--text);
    border: 1px solid transparent;
  }
  .chip--selected { background: var(--accent-soft); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .chip__remove {
    display: inline-flex; width: 14px; height: 14px; border-radius: 50%;
    align-items: center; justify-content: center; color: inherit; opacity: .7;
  }
  .chip__remove:hover { opacity: 1; background: rgba(0,0,0,.08); }
  .chip__remove svg { width: 10px; height: 10px; }
  .chip__swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Badge / Chip</h1>

  <section>
    <p class="stage__label">Status badges</p>
    <div class="stage__row" style="align-items:center;">
      <span class="badge badge--neutral"><span class="badge__dot"></span>Draft</span>
      <span class="badge badge--accent"><span class="badge__dot"></span>In review</span>
      <span class="badge badge--success"><span class="badge__dot"></span>Published</span>
      <span class="badge badge--warn"><span class="badge__dot"></span>Needs attention</span>
      <span class="badge badge--error"><span class="badge__dot"></span>Failed</span>
    </div>
  </section>

  <section>
    <p class="stage__label">Count badges (used in panel headers)</p>
    <div class="stage__row" style="align-items:center;">
      <span class="badge badge--accent">14</span>
      <span class="badge badge--neutral">New</span>
    </div>
  </section>

  <section>
    <p class="stage__label">Filter chips</p>
    <div class="stage__row" style="align-items:center;">
      <span class="chip chip--selected"><span class="chip__swatch" style="background:var(--accent);"></span>Stay</span>
      <span class="chip"><span class="chip__swatch" style="background:#00A470;"></span>Eat</span>
      <span class="chip"><span class="chip__swatch" style="background:#F89B17;"></span>See</span>
      <span class="chip">Do
        <span class="chip__remove" role="button" aria-label="Remove Do filter">
          <svg viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
      </span>
    </div>
  </section>
</main>
<script src="component-embed.js"></script>
</body>
</html>

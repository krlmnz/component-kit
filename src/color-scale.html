<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Scale — Component Kit</title>
<link rel="stylesheet" href="global.css">
<style>
  .kit-frame { width: 340px; max-width: 100%; }

  .cs-stack { display: flex; flex-direction: column; gap: var(--space-1); }
  .cs-section-label {
    font-size: var(--text-xs); font-weight: 700; color: var(--text-2);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .cs-helper { font-size: var(--text-xs); color: var(--text-2); line-height: 1.45; }

  .cs-palette {
    display: flex; flex-wrap: wrap; gap: var(--space-05);
  }
  .cs-pal {
    position: relative; width: 28px; height: 28px; border-radius: var(--radius-sm);
    border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
    flex-shrink: 0;
  }
  .cs-pal:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .cs-pal__copy {
    position: absolute; inset: 0; padding: 0;
    border-radius: inherit; background: transparent;
  }
  .cs-pal__x {
    display: inline-flex; position: absolute; top: -6px; right: -6px; z-index: 1;
    width: 14px; height: 14px; padding: 0; border-radius: 50%;
    background: var(--text); color: var(--surface); border: none;
    font-size: 8px; font-weight: 800; line-height: 1; cursor: pointer;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
  }
  .cs-pal:hover .cs-pal__x,
  .cs-pal:focus-within .cs-pal__x {
    opacity: 1; pointer-events: auto;
  }
  .cs-empty { font-size: var(--text-xs); color: var(--text-2); font-style: italic; }

  .cs-add {
    display: flex; gap: var(--space-05);
  }
  .cs-add input {
    flex: 1; min-width: 0; height: var(--control-height-sm);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    padding: 0 var(--space-05); font: inherit; font-size: var(--text-sm);
  }
  .cs-add input:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
  .cs-add input.is-err { border-color: var(--error); }

  .cs-upload {
    position: relative; display: flex; align-items: center; gap: var(--space-05);
    padding: var(--space-05) var(--space-1);
    border: 1px dashed var(--border); border-radius: var(--radius-sm);
    color: var(--text-2); font-size: var(--text-sm); font-weight: 500;
    cursor: pointer;
  }
  .cs-upload:hover, .cs-upload.is-drag, .cs-upload:focus-within {
    border-color: var(--accent); background: var(--accent-wash); color: var(--accent-text);
  }
  .cs-upload:focus-within { box-shadow: var(--focus-ring); }
  .cs-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .cs-upload.is-err { color: var(--error-text); border-color: var(--error); }

  .cs-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-05);
  }
  .cs-toolbar__title { font-size: var(--text-base); font-weight: 700; }

  .cs-scales { display: flex; flex-direction: column; gap: var(--space-1); max-height: 420px; overflow: auto; padding-right: 2px; }
  .cs-scales::-webkit-scrollbar { width: 4px; }
  .cs-scales::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cs-card {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface-2); padding: var(--space-1);
    display: flex; flex-direction: column; gap: var(--space-1);
  }
  .cs-card__top {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-05);
  }
  .cs-card__ends { display: flex; align-items: center; gap: 6px; }
  .cs-card__ends span { font-size: var(--text-xs); color: var(--text-2); font-weight: 600; }
  .cs-dot {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border);
    cursor: pointer; flex-shrink: 0;
  }
  .cs-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cs-steps { display: flex; align-items: center; gap: 4px; }
  .cs-steps__label { font-size: var(--text-xs); color: var(--text-2); font-weight: 600; }
  .cs-steps__opts {
    display: flex; gap: 1px; padding: 2px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .cs-steps__opt {
    border: none; background: transparent; color: var(--text-2);
    font: inherit; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: calc(var(--radius-sm) - 2px); cursor: pointer;
  }
  .cs-steps__opt.is-active { background: var(--surface-2); color: var(--text); box-shadow: var(--shadow); }

  .cs-row { display: flex; gap: 2px; }
  .cs-step { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .cs-swatch {
    width: 100%; aspect-ratio: 1; border-radius: 3px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
    position: relative; overflow: hidden;
  }
  .cs-swatch:hover { transform: scaleY(1.08); z-index: 1; }
  .cs-swatch__flash {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.5); color: #fff; font-size: 9px; font-weight: 700;
  }
  .cs-swatch.is-flash .cs-swatch__flash { display: flex; }
  .cs-hex {
    font-size: 8px; color: var(--text-2); font-variant-numeric: tabular-nums;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .cs-previews { display: flex; flex-direction: column; gap: 6px; }
  .cs-preview__label {
    font-size: 9px; font-weight: 700; color: var(--text-2);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px;
  }
  .cs-preview svg { display: block; width: 100%; height: 44px; border-radius: 4px; }

  .cs-pop {
    position: fixed; z-index: 40; display: none; width: 180px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-1); box-shadow: var(--shadow-pop);
  }
  .cs-pop[hidden] { display: none; }
  .cs-pop.is-open { display: block; }
  .cs-pop__title {
    font-size: var(--text-xs); font-weight: 700; color: var(--text-2);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
  }
  .cs-pop__specials { display: flex; gap: 4px; margin-bottom: 6px; }
  .cs-pop__spec {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: none; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .cs-pop__spec-swatch { width: 100%; height: 16px; border-radius: 3px; border: 1px solid var(--border); }
  .cs-pop__spec-label { font-size: 8px; font-weight: 700; color: var(--text-2); text-transform: uppercase; }
  .cs-pop__grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .cs-pop__cell {
    aspect-ratio: 1; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent);
  }
  .cs-pop__cell.is-selected, .cs-pop__cell:hover { border-color: var(--text); }

  .cs-note {
    font-size: 10px; color: var(--text-2); line-height: 1.4;
    padding-top: var(--space-05); border-top: 1px solid var(--border);
  }

  #csCanvas { display: none; }
</style>
</head>
<body>
<header class="theme-toggle">
  <button class="btn" type="button" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Color Scale</h1>
  <p class="stage__label">Perceptual brand → data scales for maps and charts</p>

  <div class="stage__row" style="align-items:flex-start;">
    <section class="panel panel--pop kit-frame" aria-label="Color Scale">
      <header class="panel__header">
        <div class="panel__heading"><h2 class="panel__title">Color Scale</h2></div>
        <div class="panel__actions">
          <button class="icon-btn" type="button" id="csShuffle" aria-label="Shuffle scales" title="Shuffle scales">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2h4v4M2 14 14 2M6 14H2v-4M14 10v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" type="button" id="csAddScale" aria-label="Add scale" title="Add scale">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Close">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="panel__body cs-stack">
        <div class="cs-stack">
          <div class="cs-section-label">Your colors</div>
          <p class="cs-helper">Paste hex, upload an image, or click a scale swatch to pull it into this palette.</p>
          <div class="cs-palette" id="csPalette"></div>
          <div class="cs-add">
            <input id="csHexInput" type="text" placeholder="#1A7EAA or rgb()" autocomplete="off" spellcheck="false" aria-label="Add color">
            <button class="btn btn--secondary btn--sm" type="button" id="csHexAdd">Add</button>
          </div>
          <label class="cs-upload" id="csUpload">
            <input type="file" id="csFile" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" aria-labelledby="csUploadText">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 11V3M8 3 5 6M8 3l3 3M3 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="csUploadText">Upload image to extract</span>
          </label>
        </div>

        <div class="cs-toolbar">
          <div class="cs-toolbar__title">Scales</div>
          <span class="cs-helper" id="csCount">0</span>
        </div>
        <div class="cs-scales" id="csScales"></div>
        <p class="cs-note">Scales mix endpoints in OKLab (perceptual). Click a swatch to copy and add it to Your colors.</p>
      </div>
    </section>
  </div>
</main>

<div class="cs-pop" id="csPop" role="dialog" aria-label="Choose color" hidden>
  <div class="cs-pop__title">Choose color</div>
  <div class="cs-pop__specials">
    <button type="button" class="cs-pop__spec" data-hex="#FFFFFF"><span class="cs-pop__spec-swatch" style="background:#fff"></span><span class="cs-pop__spec-label">White</span></button>
    <button type="button" class="cs-pop__spec" data-hex="#111416"><span class="cs-pop__spec-swatch" style="background:#111416"></span><span class="cs-pop__spec-label">Black</span></button>
  </div>
  <div class="cs-pop__grid" id="csPopGrid"></div>
</div>
<canvas id="csCanvas"></canvas>

<script src="component-embed.js"></script>
<script>
(function () {
  const BRAND = [
    "#A7CADA","#00A470","#2592C2","#434340","#A77943",
    "#BACD2F","#D556AA","#F89B17","#FCF9E8","#FCFBA0",
    "#FF4E4F","#FFE901","#FFF8DC"
  ];
  const ALLOWED = ["image/png","image/jpeg","image/gif","image/webp","image/svg+xml"];
  const BAR_VALS = [0.28,0.65,0.42,0.87,0.35,0.78,0.55,0.19,0.96,0.48];
  const CHORO = [
    [0.08,0.20,0.38,0.55,0.70,0.82],
    [0.18,0.38,0.60,0.80,0.90,0.72],
    [0.28,0.52,0.75,0.98,0.84,0.60],
    [0.15,0.34,0.54,0.70,0.60,0.40],
    [0.06,0.16,0.30,0.44,0.34,0.20]
  ];

  let globals = [];
  let scales = [];
  let idCtr = 0;
  let popCtx = null;

  function hexToRgb(hex) {
    hex = hex.replace(/^#/,"");
    if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1).toUpperCase();
  }
  function srgbToLinear(c) {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function linearToSrgb(c) {
    const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    return Math.round(Math.min(255, Math.max(0, v * 255)));
  }
  function rgbToOklab(r, g, b) {
    const lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
    const l = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
    const m = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
    const s = 0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb;
    const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
    return [
      0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
      1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
      0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
    ];
  }
  function oklabToRgb(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    const lr = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
    const lg = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
    const lb = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
    return [linearToSrgb(lr), linearToSrgb(lg), linearToSrgb(lb)];
  }
  function deltaE(hexA, hexB) {
    const [L1, a1, b1] = rgbToOklab(...hexToRgb(hexA));
    const [L2, a2, b2] = rgbToOklab(...hexToRgb(hexB));
    return Math.hypot(L1 - L2, a1 - a2, b1 - b2);
  }
  function blendPerceptual(aHex, bHex, t) {
    const A = rgbToOklab(...hexToRgb(aHex));
    const B = rgbToOklab(...hexToRgb(bHex));
    const L = A[0] + (B[0] - A[0]) * t;
    const a = A[1] + (B[1] - A[1]) * t;
    const b = A[2] + (B[2] - A[2]) * t;
    return rgbToHex(...oklabToRgb(L, a, b));
  }
  function makeBlendScale(aHex, bHex) {
    return Array.from({ length: 11 }, (_, i) => blendPerceptual(aHex, bHex, i / 10));
  }
  function sampleColors(colors, n) {
    if (n >= colors.length) return colors;
    if (n === 1) return [colors[Math.floor(colors.length / 2)]];
    return Array.from({ length: n }, (_, i) =>
      colors[Math.round(i * (colors.length - 1) / (n - 1))]
    );
  }
  function getSteps(sc) {
    return sampleColors(makeBlendScale(sc.colorA, sc.colorB || "#FFFFFF"), sc.steps || 11);
  }
  function valueToColor(steps, v) {
    return steps[Math.round(Math.max(0, Math.min(1, v)) * (steps.length - 1))];
  }
  function parseColor(raw) {
    raw = raw.trim();
    if (/^[0-9A-Fa-f]{3}$/.test(raw)) raw = "#" + raw;
    if (/^[0-9A-Fa-f]{6}$/.test(raw)) raw = "#" + raw;
    if (/^#[0-9A-Fa-f]{3}$/.test(raw)) {
      const [, r, g, b] = raw.match(/^#(.)(.)(.)$/);
      return ("#" + r + r + g + g + b + b).toUpperCase();
    }
    if (/^#[0-9A-Fa-f]{6}$/.test(raw)) return raw.toUpperCase();
    const m = raw.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
    if (m) return rgbToHex(+m[1], +m[2], +m[3]);
    try {
      const cv = document.createElement("canvas"); cv.width = cv.height = 1;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#000"; cx.fillRect(0, 0, 1, 1);
      cx.fillStyle = raw; cx.fillRect(0, 0, 1, 1);
      const d = cx.getImageData(0, 0, 1, 1).data;
      if (d[0] === 0 && d[1] === 0 && d[2] === 0 && raw.toLowerCase() !== "black") return null;
      return rgbToHex(d[0], d[1], d[2]);
    } catch (e) { return null; }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pickRandom(arr, exclude) {
    const pool = arr.filter(c => c !== exclude);
    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : arr[0] || "#2592C2";
  }
  function createScale(colorA, colorB) {
    const pool = globals.length >= 2 ? globals : BRAND;
    const a = colorA || pickRandom(pool, null);
    const b = colorB || pickRandom(pool, a);
    return { id: ++idCtr, colorA: a, colorB: b, steps: 7 };
  }

  function buildBarSVG(sc) {
    const steps = getSteps(sc);
    const sorted = [...BAR_VALS].sort((a, b) => a - b);
    const W = 200, H = 44, pad = 1, barW = W / BAR_VALS.length;
    const rects = BAR_VALS.map((v, i) => {
      const rank = sorted.indexOf(v);
      const color = valueToColor(steps, rank / (BAR_VALS.length - 1));
      const h = Math.max(3, v * H);
      return `<rect x="${(i * barW + pad).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(barW - pad * 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" rx="1.5"/>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rects}</svg>`;
  }
  function buildChoroSVG(sc) {
    const steps = getSteps(sc);
    const ROWS = CHORO.length, COLS = CHORO[0].length, W = 200, H = 44;
    const cw = W / COLS, ch = H / ROWS;
    const cells = CHORO.flatMap((row, ri) => row.map((v, ci) => {
      const color = valueToColor(steps, v);
      return `<rect x="${(ci * cw).toFixed(1)}" y="${(ri * ch).toFixed(1)}" width="${Math.ceil(cw + 0.5)}" height="${Math.ceil(ch + 0.5)}" fill="${color}"/>`;
    })).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${cells}</svg>`;
  }

  function flash(el) {
    el.classList.add("is-flash");
    setTimeout(() => el.classList.remove("is-flash"), 700);
  }
  function copyAndMaybeAdd(hex, el, add) {
    navigator.clipboard.writeText(hex).catch(() => {});
    if (el) flash(el);
    if (add) addGlobal(hex);
  }

  function renderPalette() {
    const grid = document.getElementById("csPalette");
    if (!globals.length) {
      grid.innerHTML = `<span class="cs-empty">No colors yet.</span>`;
      return;
    }
    grid.innerHTML = globals.map(h => `
      <span class="cs-pal" style="background:${h}">
        <button type="button" class="cs-pal__copy" data-hex="${h}" aria-label="Copy ${h}" title="${h} — click to copy"></button>
        <button type="button" class="cs-pal__x" data-remove="${h}" aria-label="Remove ${h}">✕</button>
      </span>`).join("");
  }

  function cardHTML(sc) {
    const steps = sc.steps || 7;
    const opts = [5, 7, 9, 11].map(n =>
      `<button type="button" class="cs-steps__opt${n === steps ? " is-active" : ""}" data-steps="${n}" data-id="${sc.id}">${n}</button>`
    ).join("");
    const colors = getSteps(sc);
    const swatches = colors.map(hex => `
      <div class="cs-step">
        <button type="button" class="cs-swatch" style="background:${hex}" title="${hex} — add to palette" data-add="${hex}" aria-label="Add ${hex} to palette">
          <span class="cs-swatch__flash" aria-hidden="true">+</span>
        </button>
        <div class="cs-hex">${hex}</div>
      </div>`).join("");
    return `
      <div class="cs-card__top">
        <div class="cs-card__ends">
          <span>From</span>
          <button type="button" class="cs-dot" style="background:${sc.colorA}" data-dot="${sc.id}" data-end="A" title="${sc.colorA}" aria-label="From color ${sc.colorA}"></button>
          <span>→</span>
          <button type="button" class="cs-dot" style="background:${sc.colorB}" data-dot="${sc.id}" data-end="B" title="${sc.colorB}" aria-label="To color ${sc.colorB}"></button>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="cs-steps">
            <span class="cs-steps__label">Steps</span>
            <div class="cs-steps__opts">${opts}</div>
          </div>
          <button type="button" class="icon-btn" data-remove-scale="${sc.id}" aria-label="Remove scale" title="Remove">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="cs-row">${swatches}</div>
      <div class="cs-previews">
        <div><div class="cs-preview__label">Bar chart</div>${buildBarSVG(sc)}</div>
        <div><div class="cs-preview__label">Map / choropleth</div>${buildChoroSVG(sc)}</div>
      </div>`;
  }

  function renderScales() {
    const list = document.getElementById("csScales");
    document.getElementById("csCount").textContent = scales.length ? `${scales.length} scale${scales.length === 1 ? "" : "s"}` : "empty";
    if (!scales.length) {
      list.innerHTML = `<p class="cs-helper">Add a scale or shuffle to start.</p>`;
      return;
    }
    list.innerHTML = scales.map(sc => `<div class="cs-card" id="sc${sc.id}" data-id="${sc.id}">${cardHTML(sc)}</div>`).join("");
  }

  function addGlobal(hex) {
    hex = hex.toUpperCase();
    if (!globals.includes(hex)) {
      globals.push(hex);
      renderPalette();
      if (document.getElementById("csPop").classList.contains("is-open")) renderPopGrid();
    }
  }
  function removeGlobal(hex) {
    globals = globals.filter(c => c !== hex.toUpperCase());
    renderPalette();
    if (document.getElementById("csPop").classList.contains("is-open")) renderPopGrid();
  }

  function renderPopGrid() {
    const active = popCtx
      ? (popCtx.end === "A"
          ? scales.find(s => s.id === popCtx.id)?.colorA
          : scales.find(s => s.id === popCtx.id)?.colorB)
      : null;
    document.getElementById("csPopGrid").innerHTML = globals.map(h =>
      `<button type="button" class="cs-pop__cell${h === active ? " is-selected" : ""}" style="background:${h}" data-pick="${h}" title="${h}" aria-label="${h}"></button>`
    ).join("");
  }
  function openPop(id, end, el) {
    const pop = document.getElementById("csPop");
    if (pop.classList.contains("is-open") && popCtx && popCtx.id === id && popCtx.end === end) {
      closePop(true); return;
    }
    popCtx = { id, end, opener: el };
    renderPopGrid();
    const rect = el.getBoundingClientRect();
    const popW = 180, popH = 200;
    let left = rect.left, top = rect.bottom + 6;
    if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
    if (top + popH > window.innerHeight - 8) top = rect.top - popH - 6;
    pop.style.left = Math.max(8, left) + "px";
    pop.style.top = Math.max(8, top) + "px";
    pop.hidden = false;
    pop.classList.add("is-open");
    const first = pop.querySelector("button");
    if (first) first.focus();
  }
  function closePop(restore) {
    const pop = document.getElementById("csPop");
    const opener = popCtx && popCtx.opener;
    pop.classList.remove("is-open");
    pop.hidden = true;
    popCtx = null;
    if (restore && opener && opener.isConnected) opener.focus();
  }
  function pickColor(hex) {
    if (!popCtx) return;
    const sc = scales.find(s => s.id === popCtx.id);
    const id = popCtx.id;
    const end = popCtx.end;
    if (!sc) return;
    if (end === "A") sc.colorA = hex; else sc.colorB = hex;
    closePop(false);
    renderScales();
    const dot = document.querySelector(`.cs-dot[data-dot="${id}"][data-end="${end}"]`);
    if (dot) dot.focus();
  }

  async function extractColors(file) {
    return new Promise(resolve => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const cv = document.getElementById("csCanvas"), ctx = cv.getContext("2d");
        const MAX = 160, s = Math.min(MAX / img.width, MAX / img.height, 1);
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        const d = ctx.getImageData(0, 0, cv.width, cv.height).data, map = {};
        for (let i = 0; i < d.length; i += 12) {
          const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
          if (a < 128 || (r > 238 && g > 238 && b > 238) || (r < 18 && g < 18 && b < 18)) continue;
          const k = `${Math.round(r / 18) * 18},${Math.round(g / 18) * 18},${Math.round(b / 18) * 18}`;
          map[k] = (map[k] || 0) + 1;
        }
        const out = [];
        for (const [k] of Object.entries(map).sort((a, b) => b[1] - a[1])) {
          const [r, g, b] = k.split(",").map(Number);
          const hex = rgbToHex(r, g, b);
          if (!out.some(e => deltaE(e, hex) < 0.08)) {
            out.push(hex);
            if (out.length >= 12) break;
          }
        }
        resolve(out);
      };
      img.onerror = () => resolve([]);
      img.src = url;
    });
  }

  function init() {
    globals = shuffle(BRAND).slice(0, 6);
    scales = [];
    for (let i = 0; i < 3; i++) scales.push(createScale());
    renderPalette();
    renderScales();
  }

  document.getElementById("csAddScale").addEventListener("click", () => {
    scales.unshift(createScale());
    renderScales();
  });
  document.getElementById("csShuffle").addEventListener("click", () => {
    const pool = globals.length >= 2 ? globals : BRAND;
    scales.forEach(sc => {
      sc.colorA = pickRandom(pool, null);
      sc.colorB = pickRandom(pool, sc.colorA);
    });
    renderScales();
  });

  function tryAddHex() {
    const inp = document.getElementById("csHexInput");
    const parts = inp.value.split(/[\s,;]+/).filter(Boolean);
    let added = 0;
    parts.forEach(p => { const h = parseColor(p); if (h) { addGlobal(h); added++; } });
    if (added) { inp.value = ""; inp.classList.remove("is-err"); inp.removeAttribute("aria-invalid"); }
    else {
      inp.classList.add("is-err");
      inp.setAttribute("aria-invalid", "true");
      setTimeout(() => { inp.classList.remove("is-err"); inp.removeAttribute("aria-invalid"); }, 900);
    }
  }
  document.getElementById("csHexAdd").addEventListener("click", tryAddHex);
  document.getElementById("csHexInput").addEventListener("keydown", e => {
    if (e.key === "Enter") tryAddHex();
  });

  document.getElementById("csPalette").addEventListener("click", e => {
    const rem = e.target.closest("[data-remove]");
    if (rem) { removeGlobal(rem.dataset.remove); return; }
    const pal = e.target.closest("[data-hex]");
    if (pal) copyAndMaybeAdd(pal.dataset.hex, null, false);
  });

  document.getElementById("csScales").addEventListener("click", e => {
    const add = e.target.closest("[data-add]");
    if (add) { copyAndMaybeAdd(add.dataset.add, add, true); return; }
    const step = e.target.closest("[data-steps]");
    if (step) {
      const sc = scales.find(s => s.id === +step.dataset.id);
      if (sc) { sc.steps = +step.dataset.steps; renderScales(); }
      return;
    }
    const rem = e.target.closest("[data-remove-scale]");
    if (rem) {
      scales = scales.filter(s => s.id !== +rem.dataset.removeScale);
      renderScales();
      return;
    }
    const dot = e.target.closest("[data-dot]");
    if (dot) openPop(+dot.dataset.dot, dot.dataset.end, dot);
  });

  document.getElementById("csPop").addEventListener("click", e => {
    e.stopPropagation();
    const pick = e.target.closest("[data-pick]");
    if (pick) pickColor(pick.dataset.pick);
    const spec = e.target.closest("[data-hex]");
    if (spec) pickColor(spec.dataset.hex);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#csPop") && !e.target.closest(".cs-dot")) closePop(false);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.getElementById("csPop").classList.contains("is-open")) {
      e.preventDefault();
      closePop(true);
    }
  });

  const upload = document.getElementById("csUpload");
  const uploadText = document.getElementById("csUploadText");
  const fileInput = document.getElementById("csFile");
  function resetUpload() {
    uploadText.textContent = "Upload image to extract";
    upload.classList.remove("is-err");
    fileInput.removeAttribute("aria-invalid");
  }
  async function handleFile(file) {
    if (!file) return;
    if (!ALLOWED.includes(file.type)) {
      uploadText.textContent = "Try PNG, JPG, or SVG";
      upload.classList.add("is-err");
      fileInput.setAttribute("aria-invalid", "true");
      setTimeout(resetUpload, 3500);
      return;
    }
    uploadText.textContent = "Extracting…";
    const colors = await extractColors(file);
    colors.forEach(h => addGlobal(h));
    uploadText.textContent = colors.length ? `Added ${colors.length}` : "No distinct colors";
    setTimeout(resetUpload, 2200);
  }
  fileInput.addEventListener("change", e => { handleFile(e.target.files[0]); e.target.value = ""; });
  upload.addEventListener("dragover", e => { e.preventDefault(); upload.classList.add("is-drag"); });
  upload.addEventListener("dragleave", () => upload.classList.remove("is-drag"));
  upload.addEventListener("drop", e => {
    e.preventDefault(); upload.classList.remove("is-drag");
    handleFile(e.dataTransfer.files[0]);
  });

  init();
})();
</script>
</body>
</html>

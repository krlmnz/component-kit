<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inputs — Component Kit</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<header class="theme-toggle">
  <button class="btn" type="button" onclick="document.body.parentElement.dataset.theme = document.body.parentElement.dataset.theme === 'dark' ? '' : 'dark'">Toggle theme</button>
</header>

<main class="stage">
  <h1 class="stage__title">Form inputs</h1>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading"><h2 class="panel__title">Place details</h2></div>
    </header>
    <div class="panel__body">
      <div class="stage__row">

        <label class="field">
          <span class="field__label">Place name<span class="req">*</span></span>
          <input class="input" type="text" placeholder="Valle de la Luna">
          <span class="field__hint">Shown on the map pin and legend.</span>
        </label>

        <label class="field">
          <span class="field__label">Search location</span>
          <div class="input-group">
            <svg class="input-group__icon" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m13 13-2.7-2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input class="input" type="text" placeholder="Search places…">
          </div>
        </label>

        <label class="field field--invalid">
          <span class="field__label">Latitude</span>
          <input class="input" type="text" value="200.4" aria-invalid="true" aria-describedby="latitude-error">
          <span class="field__error" id="latitude-error">Must be between -90 and 90.</span>
        </label>

        <label class="field field--disabled">
          <span class="field__label">Map ID</span>
          <input class="input" type="text" value="atl_9f21ac" disabled>
        </label>

        <label class="field">
          <span class="field__label">Category</span>
          <select class="select">
            <option>Stay</option>
            <option>Eat</option>
            <option>See</option>
            <option>Do</option>
          </select>
        </label>

        <label class="field" style="max-width:480px;">
          <span class="field__label">Description</span>
          <textarea class="textarea" placeholder="A short, personal note about this place…"></textarea>
        </label>
      </div>

      <div class="stage__row" style="margin-top:var(--space-2);">
        <label class="checkbox-row"><input type="checkbox" checked> Show on guest map</label>
        <label class="radio-row"><input type="radio" name="privacy" checked> Public</label>
        <label class="radio-row"><input type="radio" name="privacy"> Private</label>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="switch__track"></span>
          Auto-publish edits
        </label>
      </div>
    </div>
  </section>

  <section class="panel">
    <header class="panel__header">
      <div class="panel__heading">
        <h2 class="panel__title">Compact utility inputs</h2>
        <p class="panel__subtitle">One shared <code class="code-inline">.combo</code> for hex, opacity, and weight — same height and markup everywhere (Color Library, Map Layers, editors).</p>
      </div>
    </header>
    <div class="panel__body">
      <p class="field-label">Fill / stroke</p>
      <div class="combo" role="group" aria-label="Color and stroke controls">
        <span class="swatch" style="--swatch-color:#C3DDD6;" aria-hidden="true"></span>
        <label class="combo__hex">
          <span class="combo__prefix">#</span>
          <input class="combo__input" type="text" value="C3DDD6" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Hex color">
        </label>
        <label class="combo__opacity">
          <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Opacity percentage">
          <span class="combo__suffix">%</span>
        </label>
        <label class="combo__width">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 5h12M2 8h12M2 11h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input class="combo__input" type="number" value="1" min="0" step="0.5" inputmode="decimal" aria-label="Stroke weight">
        </label>
      </div>

      <p class="field-label" style="margin-top:var(--space-2);">Hex + opacity only</p>
      <div class="combo" role="group" aria-label="Color controls">
        <span class="swatch" style="--swatch-color:#9A1818;" aria-hidden="true"></span>
        <label class="combo__hex">
          <span class="combo__prefix">#</span>
          <input class="combo__input" type="text" value="9A1818" maxlength="6" pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" aria-label="Hex color">
        </label>
        <label class="combo__opacity">
          <input class="combo__input" type="number" value="100" min="0" max="100" step="1" inputmode="numeric" aria-label="Opacity percentage">
          <span class="combo__suffix">%</span>
        </label>
      </div>
    </div>
  </section>
</main>
<script src="component-embed.js"></script>
</body>
</html>
